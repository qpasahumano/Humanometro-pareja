<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020817">
  <title>Humanómetro Parejas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app" aria-label="Humanómetro Parejas">

    <div class="interface-wrap">

      <!-- IMAGEN BASE DE LA INTERFAZ -->
      <img
        class="interface-image"
        src="interfaz-parejas-referencia.png"
        alt="Humanómetro Parejas"
        draggable="false"
      >

      <!-- INDICACIÓN PROGRESIVA -->
      <div
        id="guidance"
        class="guidance"
        aria-live="polite"
        hidden>
      </div>

      <!-- CAPA INTERACTIVA DE LOS 9 SEGMENTOS -->
      <svg
        id="wheelLayer"
        class="wheel-layer"
        viewBox="0 0 1024 1536"
        preserveAspectRatio="none"
        aria-hidden="true">
      </svg>

      <!-- CORAZÓN / INICIO -->
      <button
        id="enableHeart"
        class="hotspot heart-hotspot"
        type="button"
        aria-label="Habilitar corazón">
      </button>

      <!-- MEDIOS DE PAGO -->
      <button
        class="hotspot payment-hotspot payment-mercado"
        type="button"
        aria-label="Mercado Pago"
        disabled>
      </button>

      <button
        class="hotspot payment-hotspot payment-paypal"
        type="button"
        aria-label="PayPal"
        disabled>
      </button>

      <button
        class="hotspot payment-hotspot payment-payoneer"
        type="button"
        aria-label="Payoneer"
        disabled>
      </button>

    </div>

  </main>


  <!-- =========================
       MODAL DE PREGUNTAS
       ========================= -->

  <div id="questionModal" class="modal" hidden>

    <div class="modal-backdrop"></div>

    <section
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle">

      <button
        id="closeModal"
        class="modal-close"
        type="button"
        aria-label="Cerrar">
        ×
      </button>

      <div class="modal-kicker">
        HUMANÓMETRO PAREJAS
      </div>

      <h2 id="modalTitle"></h2>

      <p
        id="modalSubtitle"
        class="modal-subtitle">
      </p>

      <form id="questionForm">

        <div id="questions"></div>

        <button
          class="continue-button"
          type="submit">
          COMPLETAR BLOQUE
        </button>

      </form>

    </section>

  </div>


  <!-- =========================
       MODAL RESULTADO FINAL
       ========================= -->

  <div id="finalModal" class="modal" hidden>

    <div class="modal-backdrop"></div>

    <section
      class="modal-card final-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="finalTitle">

      <button
        id="closeFinal"
        class="modal-close"
        type="button"
        aria-label="Cerrar">
        ×
      </button>

      <div class="modal-kicker">
        HUMANÓMETRO PAREJAS
      </div>

      <h2 id="finalTitle">
        Tu lectura del vínculo
      </h2>

      <div id="finalResult"></div>

    </section>

  </div>


  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
