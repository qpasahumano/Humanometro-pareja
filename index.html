<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020817">
  <title>Humanómetro Parejas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <section class="interface">

      <header class="title">
        <div class="title-main">Humanómetro</div>
        <div class="title-sub">PAREJAS</div>
      </header>

      <div class="subtitle">
        Lectura de integración humana en el tiempo
      </div>


      <div class="wheel-container">

        <div class="wheel-glow"></div>

        <svg
          class="wheel-layer"
          viewBox="0 0 1024 1024"
          preserveAspectRatio="xMidYMid meet"
          aria-label="Humanómetro Parejas">

          <g id="segmentColors"></g>
          <g id="segmentHits"></g>

        </svg>


        <div class="segment-content">

          <div class="segment-label segment-label-1">
            <span class="segment-number">1</span>
            <span class="segment-name">Trato</span>
          </div>

          <div class="segment-label segment-label-2">
            <span class="segment-number">2</span>
            <span class="segment-name">Comunicación</span>
          </div>

          <div class="segment-label segment-label-3">
            <span class="segment-number">3</span>
            <span class="segment-name">Conexión</span>
          </div>

          <div class="segment-label segment-label-4">
            <span class="segment-number">4</span>
            <span class="segment-name">Cuidado</span>
          </div>

          <div class="segment-label segment-label-5">
            <span class="segment-number">5</span>
            <span class="segment-name">Respeto</span>
          </div>

          <div class="segment-label segment-label-6">
            <span class="segment-number">6</span>
            <span class="segment-name">Aporte</span>
          </div>

          <div class="segment-label segment-label-7">
            <span class="segment-number">7</span>
            <span class="segment-name">Conflictos</span>
          </div>

          <div class="segment-label segment-label-8">
            <span class="segment-number">8</span>
            <span class="segment-name">Celos</span>
          </div>

          <div class="segment-label segment-label-9">
            <span class="segment-number">9</span>
            <span class="segment-name">Crisis</span>
          </div>

        </div>


        <div class="wheel-center">

          <div
            class="heart-symbol"
            id="heartSymbol"
            aria-hidden="true">
            ♥
          </div>

          <div
            class="center-letter"
            aria-hidden="true">
            H
          </div>

          <button
            id="enableHeart"
            class="heart-button"
            type="button">
            HABILITAR CORAZÓN
          </button>

        </div>

      </div>


      <div class="payments">

        <button
          id="paymentMercado"
          class="payment-button"
          type="button">
          Mercado Pago
        </button>

        <button
          id="paymentPaypal"
          class="payment-button"
          type="button">
          PayPal
        </button>

        <button
          id="paymentPayoneer"
          class="payment-button"
          type="button">
          Payoneer
        </button>

      </div>


      <div
        id="questionModal"
        class="modal"
        hidden>

        <div class="modal-backdrop"></div>

        <section
          class="modal-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle">

          <button
            id="closeModal"
            class="modal-close"
            type="button"
            aria-label="Cerrar">
            ×
          </button>

          <div id="modalContent"></div>

        </section>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
