<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#020817"
  >

  <title>Humanómetro Parejas</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="app">

    <section
      class="interface"
      aria-label="Humanómetro Parejas"
    >

      <!--
        IMAGEN VISUAL BASE.
        Debe estar en la misma carpeta que este archivo.
      -->
      <img
        class="interface-image"
        src="interfaz-parejas-referencia.png"
        alt="Humanómetro Parejas"
        draggable="false"
      >

      <!--
        CAPA INTERACTIVA DE LA RUEDA.
        La geometría coincide con la rueda de la imagen.
      -->
      <svg
        class="interaction-layer"
        viewBox="0 0 1024 1536"
        preserveAspectRatio="none"
        aria-hidden="true"
      >

        <defs>

          <filter
            id="segmentGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
          >

            <feGaussianBlur
              stdDeviation="7"
              result="blur"
            />

            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>

          </filter>

        </defs>

        <g id="segmentColors"></g>

        <g id="segmentHits"></g>

      </svg>


      <!--
        BOTÓN REAL SOBRE HABILITAR CORAZÓN.
        La imagen ya contiene el diseño visual.
      -->
      <button
        id="enableHeart"
        class="hotspot heart-hotspot"
        type="button"
        aria-label="Habilitar corazón"
      ></button>


      <!--
        MEDIOS DE PAGO.
        Los botones visuales pertenecen a la imagen.
      -->

      <button
        id="paymentMercado"
        class="hotspot payment-hotspot payment-mercado"
        type="button"
        aria-label="Mercado Pago"
      ></button>

      <button
        id="paymentPaypal"
        class="hotspot payment-hotspot payment-paypal"
        type="button"
        aria-label="PayPal"
      ></button>

      <button
        id="paymentPayoneer"
        class="hotspot payment-hotspot payment-payoneer"
        type="button"
        aria-label="Payoneer"
      ></button>


      <!--
        MODAL DE PREGUNTAS
      -->

      <div
        id="questionModal"
        class="modal"
        hidden
      >

        <div class="modal-backdrop"></div>

        <section
          class="modal-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle"
        >

          <button
            id="closeModal"
            class="modal-close"
            type="button"
            aria-label="Cerrar"
          >
            ×
          </button>

          <div id="modalContent"></div>

        </section>

      </div>


      <!--
        MODAL DE RESULTADO FINAL
      -->

      <div
        id="finalModal"
        class="modal"
        hidden
      >

        <div class="modal-backdrop"></div>

        <section
          class="modal-card final-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="finalTitle"
        >

          <button
            id="closeFinal"
            class="modal-close"
            type="button"
            aria-label="Cerrar"
          >
            ×
          </button>

          <h2
            id="finalTitle"
            class="modal-title"
          >
            Lectura de tu vínculo
          </h2>

          <div id="finalResult"></div>

        </section>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
