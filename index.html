<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020817">
  <title>Humanómetro Parejas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <section class="interface">

      <div class="title">
        <div class="title-main">Humanómetro</div>
        <div class="title-sub">PAREJAS</div>
      </div>

      <div class="subtitle">
        Lectura de integración humana en el tiempo
      </div>

      <div class="wheel-container">

        <div class="wheel-glow"></div>

        <svg
          class="wheel-layer"
          viewBox="0 0 1024 1536"
          preserveAspectRatio="none"
          aria-label="Humanómetro Parejas">

          <g id="segmentColors"></g>
          <g id="segmentHits"></g>

        </svg>

        <div class="wheel-center">

          <div class="heart-symbol" id="heartSymbol">♥</div>

          <button
            id="enableHeart"
            class="heart-button"
            type="button">
            HABILITAR CORAZÓN
          </button>

        </div>

      </div>

      <div class="segment-labels">

        <span class="label label-1">Trato</span>
        <span class="label label-2">Comunicación</span>
        <span class="label label-3">Conexión</span>
        <span class="label label-4">Cuidado</span>
        <span class="label label-5">Respeto</span>
        <span class="label label-6">Aporte</span>
        <span class="label label-7">Conflictos</span>
        <span class="label label-8">Celos</span>
        <span class="label label-9">Crisis</span>

      </div>

      <div class="payments">

        <button
          id="paymentMercado"
          class="payment-button"
          type="button">
          Mercado Pago
        </button>

        <button
          id="paymentPaypal"
          class="payment-button"
          type="button">
          PayPal
        </button>

        <button
          id="paymentPayoneer"
          class="payment-button"
          type="button">
          Payoneer
        </button>

      </div>

      <div
        id="questionModal"
        class="modal"
        hidden>

        <div class="modal-backdrop"></div>

        <section
          class="modal-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle">

          <button
            id="closeModal"
            class="modal-close"
            type="button"
            aria-label="Cerrar">
            ×
          </button>

          <div id="modalContent"></div>

        </section>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
